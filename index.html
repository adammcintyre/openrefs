<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OpenRefs — open-source SEO intelligence</title>
    <meta
      name="description"
      content="Open-source SEO intelligence you run yourself. Keyword research, domain and backlink analysis, rank tracking and site audits, powered by your own DataForSEO key."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/favicon.svg" color="#2E6F40" />

    <!--
      Tints the browser chrome to match the app surface in each scheme, so the
      address bar does not sit as a bright band above a dark page.
    -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101913"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenRefs" />
    <meta property="og:title" content="OpenRefs — open-source SEO intelligence" />
    <meta
      property="og:description"
      content="Open-source SEO intelligence you run yourself. Keyword research, domain and backlink analysis, rank tracking and site audits, powered by your own DataForSEO key."
    />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:image:alt" content="OpenRefs — open-source SEO intelligence" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenRefs — open-source SEO intelligence" />
    <meta
      name="twitter:description"
      content="Open-source SEO intelligence you run yourself. Bring your own DataForSEO key."
    />
    <meta name="twitter:image" content="/og.svg" />

    <script>
      // Applied before first paint so the theme never flashes.
      try {
        var stored = localStorage.getItem("openrefs-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
